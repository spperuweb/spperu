name: Deploy SwellPro Perú Landing Page

on:
  push:
    branches:
      - main # Se ejecuta automáticamente cuando subes cambios a main

# Permisos necesarios para que GitHub Actions pueda escribir en GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Evita ejecuciones simultáneas si haces push muy seguidos
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm' # Optimiza la velocidad de instalación guardando la caché

      - name: Instalar dependencias
        run: npm ci # Instalación limpia basada en tu package-lock.json

      - name: Construir proyecto (Build)
        run: npm run build

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v4

      - name: Subir artefacto de construcción
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # Carpeta de salida por defecto de Vite

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
